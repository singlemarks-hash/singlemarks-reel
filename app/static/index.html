<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Maker</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#6b6b6b;--line:#e6e6e6;--line2:#d0d0d0;--soft:#f6f6f6;--err:#b42318}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:72px 20px 120px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 44px}
.tpl{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.5}
.tpl b{color:var(--fg);font-weight:500}
h2{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:40px 0 14px}
label{display:block;font-size:13px;color:var(--muted);margin:18px 0 6px}
input[type=text],textarea,input[type=number]{width:100%;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:10px 12px;font:inherit;color:var(--fg);outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--fg)}
textarea{min-height:88px;resize:vertical}
.drop{border:1px dashed var(--line2);border-radius:8px;padding:36px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:#fff}
.drop:hover,.drop.over{border-color:var(--fg);background:var(--soft)}
.drop strong{display:block;color:var(--fg);font-weight:500;margin-bottom:4px}
.drop small{font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.range{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
input[type=range]{flex:1;accent-color:#111}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--fg);color:#fff;border:1px solid var(--fg);border-radius:6px;padding:10px 18px;font:inherit;font-weight:500;cursor:pointer;margin-top:28px;transition:.15s}
.btn:hover{background:#000}
.btn:disabled{background:#f0f0f0;border-color:#f0f0f0;color:#aaa;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--fg);border-color:var(--line2);margin:0;padding:6px 12px;font-size:13px;font-weight:400}
.btn.ghost:hover{background:var(--soft)}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:22px}
.progress i{display:block;height:100%;width:0;background:var(--fg);transition:width .5s}
.stage{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
.stage.err{color:var(--err);white-space:pre-wrap;font-size:12px}
.clips{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:560px){.clips{grid-template-columns:1fr 1fr}}
.clip video{width:100%;aspect-ratio:9/16;background:#000;border-radius:6px;display:block}
.clip .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.clip a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line2)}
.clip a:hover{border-color:var(--fg)}
.caption{white-space:pre-wrap;border:1px solid var(--line);border-radius:6px;padding:16px;font-size:14px;line-height:1.7;background:var(--soft)}
.hdr{display:flex;justify-content:space-between;align-items:baseline}
.segs{font-size:13px;color:var(--muted);margin:-6px 0 16px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
hr{border:0;border-top:1px solid var(--line);margin:48px 0}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Reel Maker</h1>
  <p class="lead">공연 영상을 올리면 하이라이트 30초 × 3개와 캡션을 만듭니다.</p>

  <form id="form">
    <h2>영상</h2>
    <div class="drop" id="drop">
      <strong id="dropTitle">영상 파일을 끌어다 놓거나 클릭</strong>
      <small>MP4, MOV, MKV · 가로 영상은 9:16으로 세로 크롭</small>
      <input type="file" id="file" name="video" accept="video/*" class="hidden">
    </div>

    <label>크롭 중심</label>
    <div class="range"><span>왼쪽</span><input type="range" id="focus" name="focus" min="0" max="1" step="0.05" value="0.5"><span>오른쪽</span></div>
    <div class="hint">연주자가 한쪽으로 치우쳐 있을 때 조절합니다.</div>

    <div class="row">
      <div><label>클립 길이 (초)</label><input type="number" name="clip_seconds" value="30" min="10" max="90"></div>
      <div><label>클립 개수</label><input type="number" name="clip_count" value="3" min="1" max="6"></div>
    </div>

    <h2>아티스트</h2>
    <label>이름</label>
    <input type="text" name="artist_name" placeholder="허지수" required>
    <label>인스타그램</label>
    <input type="text" name="artist_handle" placeholder="@j12xu">
    <label>다음 공연 일정</label>
    <textarea name="schedule" placeholder="10/6(화)&#10;1부: 8:00~8:30"></textarea>

    <div class="tpl">영상 템플릿은 고정됩니다<br><b>Concert Every Night</b> · <b>매일 밤 열리는 낭만적인 공연</b></div>

    <div><button class="btn" id="submit" type="submit" disabled>릴스 만들기</button></div>
    <div class="progress hidden" id="prog"><i id="bar"></i></div>
    <div class="stage" id="stage"></div>
  </form>

  <section class="hidden" id="result">
    <hr>
    <div class="hdr"><h2 style="margin-top:0">결과</h2><button class="btn ghost" id="again" type="button">새로 만들기</button></div>
    <div class="segs" id="segs"></div>
    <div class="clips" id="clips"></div>
    <div class="hdr"><h2>캡션</h2><button class="btn ghost" id="copy" type="button">복사</button></div>
    <div class="caption" id="caption"></div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const file=$('#file'),drop=$('#drop'),submit=$('#submit'),bar=$('#bar'),stage=$('#stage');
drop.onclick=()=>file.click();
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>{file.files=ev.dataTransfer.files;onFile()});
file.onchange=onFile;
function onFile(){const f=file.files[0];if(!f)return;$('#dropTitle').textContent=`${f.name} · ${(f.size/1048576).toFixed(0)} MB`;submit.disabled=false}

$('#form').onsubmit=async ev=>{
  ev.preventDefault(); if(!file.files[0])return;
  submit.disabled=true; stage.className='stage'; stage.textContent='업로드 중'; bar.style.width='1%';$('#prog').classList.remove('hidden');
  const fd=new FormData(ev.target);
  const id=await new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST','/api/jobs');
    x.upload.onprogress=e=>{if(e.lengthComputable){const p=e.loaded/e.total;bar.style.width=(p*2)+'%';stage.textContent=`업로드 중 ${(p*100).toFixed(0)}%`}};
    x.onload=()=>x.status<300?res(JSON.parse(x.response).id):rej(new Error(x.response));x.onerror=()=>rej(new Error('네트워크 오류'));x.send(fd)})
    .catch(e=>{stage.className='stage err';stage.textContent='업로드 실패: '+e.message;submit.disabled=false});
  if(!id)return;
  poll(id);
};
async function poll(id){
  const r=await fetch('/api/jobs/'+id); const st=await r.json();
  bar.style.width=st.progress+'%'; stage.textContent=st.stage;
  if(st.status==='error'){stage.className='stage err';stage.textContent='오류: '+st.error;submit.disabled=false;return}
  if(st.status!=='done'){setTimeout(()=>poll(id),1500);return}
  show(id,st);
}
const fmt=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
function show(id,st){
  $('#result').classList.remove('hidden');
  $('#segs').textContent=`원본 ${fmt(st.source.duration)} · 선택 구간 `+st.clips.map(c=>`${fmt(c.start)}–${fmt(c.end)}`).join(', ');
  $('#clips').innerHTML=st.clips.map(c=>`<div class="clip">
    <video src="${c.video}" poster="${c.thumb}" controls playsinline preload="metadata"></video>
    <div class="meta"><span>${c.index} · ${fmt(c.start)}–${fmt(c.end)}</span><a href="/api/jobs/${id}/download/${c.index}">다운로드</a></div></div>`).join('');
  $('#caption').textContent=st.caption;
  $('#result').scrollIntoView({behavior:'smooth'});
  submit.disabled=false;
}
$('#copy').onclick=async()=>{await navigator.clipboard.writeText($('#caption').textContent);$('#copy').textContent='복사됨';setTimeout(()=>$('#copy').textContent='복사',1500)};
$('#again').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});file.value='';$('#dropTitle').textContent='영상 파일을 끌어다 놓거나 클릭';submit.disabled=true;$('#result').classList.add('hidden');bar.style.width='0';stage.textContent=''};
</script>
</body>
</html>
